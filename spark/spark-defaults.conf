spark.jars.packages                           org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3,org.apache.spark:spark-avro_2.13:4.1.3
spark.jars.ivy=/tmp/.ivy2

spark.driver.host                             spark-connect
spark.driver.bindAddress                      0.0.0.0
spark.driver.extraJavaOptions                 -Daws.region=us-east-1 -Divy.cache.dir=/tmp/.ivy2 -Divy.home=/tmp/.ivy2
spark.executor.extraJavaOptions               -Daws.region=us-east-1

spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

spark.sql.catalog.icbrg                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.icbrg.catalog-impl          org.apache.iceberg.rest.RESTCatalog
spark.sql.catalog.icbrg.uri                   http://iceberg-rest:8181
spark.sql.catalog.icbrg.warehouse             s3a://warehouse/
spark.sql.catalog.icbrg.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.icbrg.s3.endpoint           http://minio:9000
spark.sql.catalog.icbrg.s3.access-key-id      admin
spark.sql.catalog.icbrg.s3.secret-access-key  password
spark.sql.catalog.icbrg.s3.path-style-access  true
spark.sql.catalog.icbrg.s3.region             us-east-1

spark.hadoop.fs.s3a.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                  http://minio:9000
spark.hadoop.fs.s3a.access.key                admin
spark.hadoop.fs.s3a.secret.key                password
spark.hadoop.fs.s3a.path.style.access         true
spark.hadoop.fs.s3a.region                    us-east-1