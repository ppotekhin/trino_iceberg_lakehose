version: "3"

services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./env/db.env
    ports:
      - 15432:5432
    volumes:
      - ./scripts/init_dbs.sh:/docker-entrypoint-initdb.d/init_dbs.sh
      - postgres_data:/var/lib/postgresql/data
  minio:
    image: quay.io/minio/minio
    container_name: minio
    env_file:
      - ./env/minio.env
    networks:
      default:
        aliases:
          - warehouse.minio
    ports:
      - 9001:9001
      - 9000:9000
    volumes:
      - minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
  mc:
    depends_on:
      - minio
    image: quay.io/minio/mc
    container_name: mc
    env_file:
      - ./env/aws.env
      - ./env/minio.env
    volumes:
      - ./scripts/init_minio.sh:/usr/bin/init_minio.sh
    entrypoint: /usr/bin/init_minio.sh
  iceberg-catalog:
    image: tabulario/iceberg-rest
    container_name: iceberg-rest
    networks:
      default:
        aliases:
          - rest
    ports:
      - 8181:8181
    env_file:
      - ./env/aws.env
      - ./env/iceberg_catalog.env
    depends_on:
      - db
  trino:
    image: trinodb/trino:483
    container_name: trino
    ports:
      - 28080:8080
    volumes:
      - ./trino:/etc/trino
    env_file:
      - ./env/aws.env
    depends_on:
      - iceberg-catalog
    environment:
      TRINO_JVM_MAX_HEAP_SIZE: 2G 
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 3G
        reservations:
          cpus: '1.0'
          memory: 2G
  spark-master:
    build:
      context: ./spark
    container_name: spark-master
    depends_on:
      - iceberg-catalog
      - minio
    command: ["/opt/spark/sbin/start-master.sh"]
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - 8088:8080
      - 7077:7077
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
  spark-worker:
    build:
      context: ./spark
    depends_on:
      - spark-master
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_CORES: 2
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    deploy:
      replicas: 2
  spark-connect:
    build:
      context: ./spark
    container_name: spark-connect
    depends_on:
      - spark-master
      - spark-worker
    command:
      - "/opt/spark/sbin/start-connect-server.sh"
      - "--master"
      - "spark://spark-master:7077"
      - "--driver-memory"
      - "2g"
    ports:
      - 15002:15002
      - 4040:4040
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
  kafka:
    image: apache/kafka:4.4.0-rc4
    container_name: kafka
    ports:
      - 9092:9092
    volumes:
      - kafka_data:/var/lib/kafka/data
    env_file:
      - ./env/kafka.env
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka:9092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-lakehouse"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"
  airflow:
    build:
      context: .
    container_name: airflow
    env_file:
      - ./env/airflow.env
    ports:
      - 18080:8080
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs/airflow:/opt/airflow/logs
      - ./dbt_project:/opt/airflow/dbt_project
      - /opt/airflow/dbt_project/dbt_packages
      - ./data:/home/iceberg/data
      - ./env/airflow_users.json:/opt/airflow/simple_auth_manager_passwords.json.generated
      # - ./airflow/airflow.cfg:/opt/airflow/airflow.cfg
    depends_on:
      - db

volumes:
  postgres_data:
  minio_data:
  kafka_data:
