#single node install config
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://trino:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}

query.max-memory=1250MB
query.max-total-memory=1500MB
query.max-memory-per-node=1250MB

spill-enabled=false
# spiller-spill-path=/tmp/trino-spill
# max-spill-per-node=10GB
# query-max-spill-per-node=10GB

task.concurrency=1
task.max-worker-threads=1
task.max-writer-count=1